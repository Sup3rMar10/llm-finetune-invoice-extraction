name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint + unit tests (no GPU / no model download)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Dataset generation is reproducible and matches the committed data
        run: |
          python -m src.generate_data --out /tmp/d1
          python -m src.generate_data --out /tmp/d2
          diff -r /tmp/d1 /tmp/d2
          diff -r /tmp/d1 data
